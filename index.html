*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.5 Nunito,system-ui,sans-serif;min-height:100%}

.w{max-width:740px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font:400 1.15rem 'Lilita One',sans-serif;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.chip,.ic{background:var(--card);border:2px solid var(--line);border-radius:999px;font-weight:800;color:var(--ink)}
.chip{padding:3px 11px;margin-right:8px}.ic{width:42px;height:42px;cursor:pointer;font-size:1.1rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--sh)}
.c{text-align:center}.c h1{font-size:2rem;margin:6px 0}.c p{color:var(--mu);max-width:46ch;margin:6px auto}
.btn{background:var(--ac);color:var(--ai);border:0;border-radius:16px;padding:13px 22px;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--sh)}

.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.map{display:grid;gap:12px;margin-top:18px}
.lv{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-left:12px solid var(--b);border-radius:18px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.lv[disabled]{opacity:.5;cursor:not-allowed}.lv .e{font-size:1.7rem}.lv b{font:400 1.1rem 'Lilita One',sans-serif;display:block}.lv small{color:var(--mu)}.lv .s{margin-left:auto;font-weight:800;white-space:nowrap}
.big{font:400 3.2rem 'Lilita One',sans-serif;line-height:1;margin:6px 0}
.qh{display:flex;justify-content:space-between;margin:10px 0 6px;color:var(--mu);font-weight:800;font-size:.95rem}
.bar{height:16px;background:var(--bg2);border-radius:999px;overflow:hidden;border:2px solid var(--line)}.bar i{display:block;height:100%;background:var(--b);transition:width .3s}
.tag{display:inline-block;background:var(--bb);color:var(--bad);border-radius:999px;padding:1px 10px;font-size:.85rem;margin-bottom:8px}
.q{font:400 1.18rem/1.35 'Lilita One',sans-serif;margin:2px 0 16px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-size:1.02rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--sh);display:flex;gap:11px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:.9rem}
.opt.good{background:var(--gb);border-color:var(--good)}.opt.bad{background:var(--bb);border-color:var(--bad)}
.fb{margin-top:16px;border-radius:16px;padding:13px 15px}.fb.good{background:var(--gb);border:2px solid var(--good)}.fb.bad{background:var(--bb);border:2px solid var(--bad)}
.fb b{display:block;font:400 1.1rem 'Lilita One',sans-serif}
details{margin-bottom:12px;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:8px 14px}summary{cursor:pointer;font-weight:800}
.les h2{font-size:1.45rem;margin-bottom:10px}.les h3{font-size:1.1rem;margin:14px 0 6px}.les p{margin:6px 0}
.les table{border-collapse:collapse;width:100%;font-size:.95rem;margin:8px 0}.les th,.les td{border:2px solid var(--line);padding:6px 9px;text-align:left}.les th{background:var(--bg2)}
.key{background:var(--bg2);border-left:6px solid var(--red);border-radius:10px;padding:8px 12px;margin:10px 0}
.sx{overflow-x:auto}
svg.fig{width:100%;max-width:420px;display:block;margin:8px auto}
svg text{fill:var(--ink);font:800 13px Nunito,sans-serif}
.l{stroke:var(--ink);stroke-width:2;fill:none}.a{stroke:var(--ac);stroke-width:2;fill:none}.d{stroke:var(--red);stroke-width:2;stroke-dasharray:5 4;fill:none}.p{fill:var(--ink)}
.pop{animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes sl{0%{opacity:0;transform:translateX(-40px)}30%{opacity:1}100%{opacity:0;transform:translateX(60px)}}
.sl{position:fixed;left:0;right:0;top:38%;text-align:center;font:400 2.4rem 'Lilita One',sans-serif;pointer-events:none;color:var(--red);animation:sl .9s forwards;z-index:9}
@media(prefers-reduced-motion:reduce){.pop,.sl{animation:none}.bar i{transition:none}}

<script>
const $=s=>document.querySelector(s),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const S={li:0,qs:[],queue:[],failed:{},ok:[],done:[],n:[],un:0,dn:0,st:0,snd:true,ans:false,opts:[],k:0};
let AC;
function tone(f,t,d,ty,v){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.14,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.02)}catch(e){}}
const win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3));
function say(t){if(!S.snd||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function flash(t){const d=document.createElement('div');d.className='sl';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
$('#sb').onclick=()=>{S.snd=!S.snd;$('#sb').textContent=S.snd?'🔊':'🔇';if(!S.snd)try{speechSynthesis.cancel()}catch(e){}};
const GOOD=["Bravo, jeune ninja ! Ton compas a fait mouche !","Excellent ! Précis comme une règle graduée !","Hiya ! Bonne réponse !","Parfait ! Ton esprit est tranchant comme un katana !"];
const BAD=["Pas grave, jeune ninja. Lis bien l'explication, tu reviendras plus fort !","Aïe, le piège était bien caché. Lis l'explication, puis on recommence !"];

const F1=`<svg class="fig" viewBox="0 0 380 150" role="img" aria-label="Médiatrice de AB"><path class="l" d="M60 100H320"/><path class="a" d="M190 12V140"/><path class="d" d="M190 30L60 100M190 30L320 100"/><path class="l" d="M190 90H178V100M125 94v12M255 94v12"/><text x="52" y="122">A</text><text x="318" y="122">B</text><text x="186" y="122">I</text><text x="198" y="30">M</text><text x="206" y="84">MA = MB</text><text x="198" y="144">médiatrice de [AB]</text></svg>`;
const F2=`<svg class="fig" viewBox="0 0 380 120" role="img" aria-label="Parallèles et perpendiculaire"><path class="l" d="M30 30H340M30 85H340"/><path class="a" d="M120 10V110"/><path class="l" d="M120 18H132V30M120 73H132V85"/><path class="d" d="M250 24l6 6-6 6M250 79l6 6-6 6"/><text x="344" y="34">(d1)</text><text x="344" y="89">(d2)</text><text x="126" y="12">(d3)</text></svg>`;

const F4=`<svg class="fig" viewBox="0 0 380 140" role="img" aria-label="Symétrie axiale"><path class="a" d="M190 8V132"/><path class="l" d="M60 30L120 55L80 110Z"/><path class="l" d="M320 30L260 55L300 110Z"/><path class="d" d="M60 30H320M120 55H260M80 110H300"/><text x="44" y="34">A</text><text x="324" y="34">A'</text><text x="126" y="50">B</text><text x="240" y="50">B'</text><text x="74" y="126">C</text><text x="298" y="126">C'</text><text x="196" y="136">axe</text></svg>`;
const F6=`<svg class="fig" viewBox="0 0 380 150" role="img" aria-label="Cercle"><circle cx="110" cy="75" r="60" class="l"/><path class="a" d="M50 75H170"/><path class="d" d="M110 75L152.4 32.6"/><path class="l" d="M75.6 124.1H144.4"/><circle class="p" cx="110" cy="75" r="3"/><text x="106" y="92">O</text><text x="32" y="79">D</text><text x="174" y="79">E</text><text x="156" y="30">R</text><text x="66" y="142">P</text><text x="146" y="142">Q</text><path class="d" d="M215 50h16M215 80h16M215 110h16" style="stroke-dasharray:none"/><text x="238" y="54">rayon [OR]</text><text x="238" y="84">diamètre [DE]</text><text x="238" y="114">corde [PQ]</text></svg>`;

const LV=[
{n:"Ceinture blanche",e:"📏",b:"#f3f3f3",t:"Segments, droites et médiatrice",
l:`<h2>📜 Parchemin 1 : segment, droite, médiatrice</h2>
<div class="sx"><table><tr><th>Notation</th><th>Signification</th></tr><tr><td><b>[AB]</b></td><td>segment d'extrémités A et B</td></tr><tr><td><b>(AB)</b></td><td>droite qui passe par A et B</td></tr><tr><td><b>[AB)</b></td><td>demi-droite d'origine A passant par B</td></tr><tr><td><b>AB</b></td><td>longueur du segment [AB]</td></tr></table></div>
<p>Le <b>milieu</b> I de [AB] est le point du segment tel que <b>AI = IB</b>.</p>
<div class="key">🔑 La <b>médiatrice</b> de [AB] est la droite <b>perpendiculaire</b> à [AB] qui passe par son <b>milieu</b>. Tout point M de la médiatrice vérifie <b>MA = MB</b> (équidistance), et inversement.</div>${F1}
<p><b>Construction au compas :</b> deux arcs de <b>même rayon</b> (plus grand que la moitié de AB) centrés en A puis en B. On relie leurs deux points d'intersection.</p>`,
q:[
["Que désigne la notation [AB] ?","Le segment d'extrémités A et B",["La droite (AB)","La demi-droite d'origine A","La longueur AB"],"Les crochets [ ] marquent des extrémités : c'est un segment."],
["Que désigne la notation (AB) ?","La droite passant par A et B",["Le segment [AB]","La longueur entre A et B","Le milieu de A et B"],"Les parenthèses ( ) ne s'arrêtent nulle part : c'est une droite."],
["Que désigne AB (sans crochets ni parenthèses) ?","La longueur du segment [AB]",["La droite (AB)","Le segment [AB]","Le milieu de [AB]"],"AB est un nombre, par exemple AB = 6 cm."],
["I est le milieu de [AB] et AB = 9 cm. Que vaut AI ?","4,5 cm",["9 cm","18 cm","3 cm"],"Le milieu partage en deux parties égales : 9 ÷ 2 = 4,5 cm."],
["La médiatrice de [AB] est la droite…","Perpendiculaire à [AB] et passant par son milieu",["Parallèle à [AB] et passant par A","Passant par A et par B","Perpendiculaire à [AB] et passant par A"],"Il faut les deux conditions : perpendiculaire ET passant par le milieu."],
["Un point M vérifie MA = MB. Que peut-on conclure ?","M est sur la médiatrice de [AB]",["M est le milieu de [AB]","M est sur le segment [AB]","M, A et B sont alignés"],"Équidistant de A et B = sur la médiatrice. Pas forcément le milieu."],
["Pour construire la médiatrice de [AB] au compas, on trace…","Deux arcs de même rayon (plus grand que la moitié de AB), centrés en A et en B",["Deux arcs de rayon plus petit que la moitié de AB","Deux arcs centrés tous les deux en A","Un cercle de diamètre [AB]"],"Si le rayon est trop petit, les arcs ne se coupent pas."],
["Quel angle forment [AB] et sa médiatrice ?","90° (angle droit)",["45°","180°","60°"],"La médiatrice est perpendiculaire à [AB]."]]},
{n:"Ceinture jaune",e:"📐",b:"#f5c518",t:"Droites parallèles et perpendiculaires",
l:`<h2>📜 Parchemin 2 : parallèles et perpendiculaires</h2>
<p>Deux droites sont <b>perpendiculaires</b> si elles se coupent en formant un <b>angle droit</b> (symbole ⊥). Elles sont <b>parallèles</b> si elles ne se coupent jamais (symbole //).</p>${F2}
<div class="key">🔑 <b>Propriétés à connaître</b><br>• Parallèles à une même 3e droite ⟹ parallèles entre elles.<br>• Perpendiculaires à une même 3e droite ⟹ parallèles entre elles.<br>• Si (d1) // (d2) et (d3) ⊥ (d1), alors (d3) ⊥ (d2).</div>
<p><b>Codage :</b> petit <b>carré</b> = angle droit · mêmes <b>chevrons</b> = droites parallèles · mêmes <b>petits traits</b> = segments de même longueur.</p>
<p><b>Tracer la parallèle à (d) passant par A à la règle et à l'équerre :</b> on trace la perpendiculaire à (d), puis la perpendiculaire à celle-ci passant par A.</p>`,
q:[
["Que sont deux droites perpendiculaires ?","Deux droites qui se coupent en formant un angle droit",["Deux droites qui ne se coupent jamais","Deux droites qui forment un angle de 45°","Deux droites confondues"],"Perpendiculaires : angle de 90° au point d'intersection."],
["(d1) // (d3) et (d2) // (d3). Que sont (d1) et (d2) ?","Parallèles",["Perpendiculaires","Sécantes","On ne peut rien dire"],"Deux droites parallèles à une même troisième sont parallèles entre elles."],
["(d1) ⊥ (d3) et (d2) ⊥ (d3). Que sont (d1) et (d2) ?","Parallèles",["Perpendiculaires","Sécantes en oblique","On ne peut rien dire"],"Pense à deux rails coupés par une traverse à angle droit."],
["(d1) // (d2) et (d3) ⊥ (d1). Que peut-on dire de (d3) et (d2) ?","(d3) ⊥ (d2)",["(d3) // (d2)","(d3) est la médiatrice de (d2)","On ne peut rien dire"],"Une perpendiculaire à l'une des deux parallèles l'est aussi à l'autre."],
["Que signifie un petit carré dessiné dans un angle ?","L'angle est droit",["Les deux droites sont parallèles","Les deux côtés ont la même longueur","L'angle est plat"],"Le carré code l'angle droit."],
["Que signifient deux mêmes chevrons sur deux droites ?","Les deux droites sont parallèles",["Les deux droites sont perpendiculaires","Les deux segments ont la même longueur","Les droites sont confondues"],"Les chevrons codent le parallélisme."],
["Pour tracer la parallèle à (d) passant par A, on trace…","La perpendiculaire à (d), puis la perpendiculaire à celle-ci passant par A",["Une droite quelconque passant par A","La médiatrice de [AB]","Un cercle de centre A"],"Deux perpendiculaires à une même droite sont parallèles."]]},
{n:"Ceinture orange",e:"📏",b:"#ff8c1a",t:"Angles et bissectrice",
l:`<h2>📜 Parchemin 3 : angles et bissectrice</h2>
<div class="sx"><table><tr><th>Angle</th><th>Mesure</th></tr><tr><td>nul</td><td>0° (côtés confondus)</td></tr><tr><td>aigu</td><td>entre 0° et 90°</td></tr><tr><td>droit</td><td>90°</td></tr><tr><td>obtus</td><td>entre 90° et 180°</td></tr><tr><td>plat</td><td>180° (côtés opposés)</td></tr></table></div>
<p><b>Rapporteur :</b> centre sur le <b>sommet</b>, zéro sur l'un des <b>côtés</b>, on lit sur la bonne graduation.</p>
<div class="key">🔑 La <b>bissectrice</b> d'un angle le partage en <b>deux angles égaux</b>. Ses points sont à <b>égale distance des deux côtés</b>.</div>${F3}`,
q:[
["Au rapporteur, tu lis 132°. L'angle est…","Obtus",["Aigu","Droit","Plat"],"Obtus : entre 90° et 180°."],
["Un angle de 38° est…","Aigu",["Obtus","Droit","Plat"],"Aigu : moins de 90°."],
["A, O, B sont alignés et O est entre A et B. L'angle AOB est…","Plat",["Nul","Droit","Obtus"],"Côtés opposés : 180°."],
["Comment s'appelle un angle de 0° ?","Un angle nul",["Un angle plat","Un angle aigu","Un angle droit"],"Les deux côtés sont confondus."],
["Pour mesurer un angle, le centre du rapporteur se place sur…","Le sommet de l'angle",["Un point quelconque du côté","Le milieu de l'angle","L'extrémité du second côté"],"Centre sur le sommet, zéro sur un côté."],
["xOy mesure 70° et (Oz) est sa bissectrice. Combien mesure xOz ?","35°",["70°","140°","20°"],"70° ÷ 2 = 35°."],
["Un point de la bissectrice est…","À égale distance des deux côtés de l'angle",["À égale distance de deux points A et B","Toujours à 90° du sommet","Au milieu d'un segment"],"Ne confonds pas avec la médiatrice (équidistante de A et B)."]]},
{n:"Ceinture verte",e:"🪞",b:"#2ecc71",t:"La symétrie axiale",
l:`<h2>📜 Parchemin 4 : la symétrie axiale</h2>
<p>A' est le <b>symétrique</b> de A par rapport à la droite (d) si <b>(d) est la médiatrice de [AA']</b>. Un point de l'axe est son propre symétrique.</p>${F4}
<div class="key">🔑 La symétrie axiale <b>conserve</b> : les <b>longueurs</b>, les <b>alignements</b>, le <b>parallélisme</b>, les <b>mesures d'angles</b>. La figure passe <b>de l'autre côté</b> de l'axe.</div>
<p><b>Construction :</b> perpendiculaire à l'axe passant par A, puis on reporte au compas la distance de A à l'axe de l'autre côté.</p>`,

["A est un point de l'axe de symétrie. Où est son symétrique A' ?","Il est confondu avec A",["De l'autre côté, à la même distance","Au milieu de l'axe","On ne peut pas le savoir"],"Distance à l'axe = 0 : A' = A."],

["(d1) // (d2). Leurs symétriques sont…","Parallèles",["Perpendiculaires","Sécantes","Confondues"],"Le parallélisme est conservé."],
["Pour construire A', on trace d'abord…","La perpendiculaire à l'axe passant par A",["La parallèle à l'axe passant par A","Un cercle de rayon AB","La bissectrice de A"],"Puis on reporte la distance de l'autre côté."]]},
{n:"Ceinture bleue",e:"🔺",b:"#2f80ed",t:"Triangles et quadrilatères",
l:`<h2>📜 Parchemin 5 : triangles et quadrilatères</h2>
<div class="sx"><table><tr><th>Figure</th><th>Définition</th></tr><tr><td><b>Triangle isocèle</b></td><td>2 côtés de même longueur</td></tr><tr><td><b>Triangle équilatéral</b></td><td>3 côtés de même longueur</td></tr><tr><td><b>Triangle rectangle</b></td><td>1 angle droit</td></tr><tr><td><b>Rectangle</b></td><td>4 angles droits</td></tr><tr><td><b>Losange</b></td><td>4 côtés de même longueur</td></tr><tr><td><b>Carré</b></td><td>4 côtés égaux ET 4 angles droits</td></tr><tr><td><b>Parallélogramme</b></td><td>côtés opposés parallèles</td></tr></table></div>
<div class="key">🔑 Un <b>carré</b> est à la fois un rectangle et un losange. Un triangle équilatéral est aussi isocèle.</div>

<p><b>Au compas :</b> écartement = rayon, pointe sèche sur le centre.</p>`,

{n:"Ceinture noire",e:"🏯",b:"#1a1a2e",t:"Boss final : défis mixtes",
l:`<h2>📜 Parchemin final</h2><p>12 questions tirées au hasard dans les 6 chapitres.</p><div class="key">À retenir : <b>médiatrice = ⊥ + milieu</b> · <b>bissectrice = 2 angles égaux</b> · <b>diamètre = 2 × rayon</b> · <b>symétrie : conserve longueurs et angles</b>.</div>`,

const CORE=[0,1,2,3,4,5,6];
const sv=(h,c)=>`<svg class="fig" viewBox="0 0 380 ${h}" role="img" aria-label="Figure de l'exercice">${c}</svg>`;
const T=(x,y,t,m)=>`<text x="${x}" y="${y}" text-anchor="${m||'middle'}">${t}</text>`,D=(x,y)=>`<circle class="p" cx="${x}" cy="${y}" r="3.5"/>`,P=(c,d)=>`<path class="${c}" d="${d}"/>`;

const FM=sv(110,P('l','M60 75H320M125 69v12M255 69v12')+P('a','M60 50v-8H320v8')+T(190,34,'9 cm')+D(60,75)+D(190,75)+D(320,75)+T(60,98,'A')+T(190,98,'I')+T(320,98,'B')+T(125,98,'AI = ?'));
const FD=sv(200,P('l','M60 100H320')+P('d','M190 7A160 160 0 0 1 190 193M190 7A160 160 0 0 0 190 193')+P('a','M190 7V193')+D(60,100)+D(320,100)+T(60,122,'A')+T(320,122,'B'));

const FP3=sv(110,P('l','M30 25H330M30 55H330M30 85H330')+P('d','M250 19l6 6-6 6M250 49l6 6-6 6M250 79l6 6-6 6')+T(344,29,'(d1)','start')+T(344,59,'(d2)','start')+T(344,89,'(d3)','start'));
const FP7=sv(130,P('l','M30 100H340M120 88H132V100M120 30H132V42')+P('d','M120 12V125')+P('a','M30 30H340')+D(250,30)+T(256,22,'A','start')+T(320,118,'(d)'));

const ang=(d,t,b)=>{const r=d*Math.PI/180,f=n=>n.toFixed(1),X=(l,a)=>f(120+l*Math.cos(a)),Y=(l,a)=>f(110-l*Math.sin(a));return sv(130,P('l',`M320 110H120L${X(100,r)} ${Y(100,r)}`)+P('a',`M150 110A30 30 0 0 0 ${X(30,r)} ${Y(30,r)}`)+(b?P('d',`M120 110L${X(110,r/2)} ${Y(110,r/2)}`)+T(X(120,r/2),Y(120,r/2),'z'):'')+T(240,70,t,'start'))};
const FL=sv(120,P('l','M60 90H320')+P('a','M160 90A30 30 0 0 1 220 90')+D(190,90)+T(60,112,'A')+T(190,112,'O')+T(320,112,'B'));
const FN=sv(90,P('l','M120 55H320')+P('a','M120 55H200')+D(120,55)+T(120,78,'O')+T(220,40,'Ox et Oy superposées','start'));

const FS2=sv(110,P('a','M190 8V104')+D(190,55)+T(198,50,'A','start')+T(200,78,"A' = ?",'start'));
const FS3=sv(140,P('a','M190 8V132')+P('l','M70 40L130 100M310 40L250 100')+P('d','M70 40H310M130 100H250')+T(54,40,'A')+T(114,116,'B')+T(326,40,"A'")+T(266,116,"B'")+T(88,80,'6 cm','end')+T(292,80,'?','start'));
const FS6=sv(140,P('a','M190 8V132')+P('l','M40 30L120 60M40 80L120 110M340 30L260 60M340 80L260 110')+P('d','M40 30H340M40 80H340')+T(54,22,'(d1)','start')+T(54,72,'(d2)','start'));
const FS7=sv(110,P('a','M190 8V104')+D(70,60)+T(70,48,'A')+T(310,56,"A' ?"));

LV.forEach((_,i)=>{S.ok[i]=0;S.done[i]=false;S.n[i]=0});
const tot=()=>{let o=0,n=0;CORE.forEach(i=>{if(S.done[i]){o+=S.ok[i];n+=S.n[i]}});return{o,n}};
const grade=()=>{const t=tot();return t.n?t.o/t.n*20:0};
const app=$('#app'),setSt=()=>$('#st').textContent='🔥 '+S.st;
const mascot=`<svg viewBox="0 0 100 100" width="100" height="100" aria-hidden="true"><circle cx="50" cy="52" r="38" fill="#14142b"/><rect x="14" y="40" width="72" height="24" rx="10" fill="#f2c9a0"/><circle cx="36" cy="52" r="5" fill="#14142b"/><circle cx="64" cy="52" r="5" fill="#14142b"/><rect x="12" y="29" width="76" height="9" fill="#d62839"/><path d="M88 33l11-9-2 14zM88 35l10 9-10-2z" fill="#d62839"/></svg>`;

function home(){
  const any=CORE.some(i=>S.done[i]),all=CORE.every(i=>S.done[i]);
  let h=`<section class="card c pop">${mascot}<h1>Ninja Maths : objectif 20 / 20</h1><p>Géométrie 6ème. Lis chaque parchemin, puis combats ! Une question ratée revient jusqu'à ce que tu la réussisses.</p>`;
  if(any){const t=tot();h+=`<p class="big">${fmt(grade())}<small style="font-size:1.1rem"> / 20</small></p><p>${all?'Ta note du premier essai':'Note provisoire'} (${t.o} / ${t.n} du premier coup)</p>`}
  h+=`</section><div class="map">`;
  LV.forEach((L,i)=>{const lk=i>S.un;h+=`<button class="lv" style="--b:${L.b}" ${lk?'disabled':''} onclick="start(${i})"><span class="e">${L.e}</span><span><b>${i+1}. ${L.n}</b><small>${L.t}</small></span><span class="s">${S.done[i]&&S.ok[i]===S.n[i]?'⭐ ':''}${S.done[i]?S.ok[i]+' / '+S.n[i]:(lk?'🔒':'À faire')}</span></button>`});

function start(i){
  S.li=i;const L=LV[i];S.qs=typeof L.q==='function'?L.q():sh(L.q);

  app.innerHTML=`<section class="card les pop" style="border-top:12px solid ${L.b}">${L.l}<div class="btns"><button class="btn g" onclick="home()">⬅ Carte</button><button class="btn" onclick="showQ()">J'ai compris : au combat ! ⚔️</button></div></section>`;
  window.scrollTo(0,0);say(i?"Nouveau parchemin, nouvelle ceinture !":"Bienvenue au dojo, jeune ninja ! Lis bien le parchemin, puis c'est parti !");
}
function showQ(){
  const L=LV[S.li];if(!S.queue.length)return end();
  const k=S.queue[0],q=S.qs[k];S.k=k;S.ans=false;
  S.opts=sh([{t:q[1],c:1}].concat(q[2].map(t=>({t,c:0}))));

  <div class="opts">${S.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="k">${LT[i]}</span><span>${o.t}</span></button>`).join('')}</div><div id="fb"></div></div></section>`;

}
function pick(i){
  if(S.ans)return;S.ans=true;

  let fb;
  if(o.c){bs[i].classList.add('good');S.queue.shift();S.dn++;if(!S.failed[k])S.ok[S.li]++;S.st++;setSt();

    fb=`<div class="fb good"><b>✅ Bonne réponse !</b>${q[3]}</div>`;
  }else{bs[i].classList.add('bad');S.failed[k]=1;S.queue.shift();S.queue.push(k);S.st=0;setSt();
    tone(220,0,.2,'sawtooth',.07);tone(160,.15,.25,'sawtooth',.07);setTimeout(()=>say(BAD[0|Math.random()*BAD.length]),250);
    fb=`<div class="fb bad"><b>❌ Pas tout à fait…</b>${q[3]}<br><em>Cette question reviendra à la fin de la ceinture pour que tu la maîtrises.</em></div>`;}

  $('#nx').focus({preventScroll:true});$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function end(){
  const L=LV[S.li],N=S.qs.length,ok=S.ok[S.li],perfect=ok===N;S.done[S.li]=true;S.un=Math.max(S.un,Math.min(S.li+1,6));
  const last=CORE.every(i=>S.done[i]);win();say(perfect?"Sans aucune erreur ! Tu es un ninja exceptionnel !":"Terminé ! Tu as maîtrisé toutes les questions. Bravo jeune ninja !");
  const nx=S.li<6?`<button class="btn" onclick="start(${S.li+1})">Ceinture suivante ➜</button>`:(last?`<button class="btn" onclick="fin()">Voir ma note finale 🏁</button>`:'');
  app.innerHTML=`<section class="card c pop" style="--b:${L.b}"><div style="font-size:3rem">${perfect?'🏆':'🥷'}</div><h2>${L.n} obtenue !</h2><p class="big">${ok} / ${N}</p><p>${perfect?'Sans une seule erreur au premier essai : parfait !':'bonnes réponses du premier coup. Les autres, tu les as corrigées. Rejoue pour viser le sans-faute !'}</p><div class="btns"><button class="btn g" onclick="start(${S.li})">🔁 Rejouer</button>${nx}<button class="btn g" onclick="home()">🗺️ Carte</button></div></section>`;
